<style>
    body{
        font-family: Verdana, sans-serif;
        background-color: #f4f6f9;
        margin: 40px;
    }

    form{
        background-color: white;
        padding: 25px;
        border-radius: 12px;
        width: 75%;
        margin: auto;
        box-shadow: 0px 0px 8px gray;
    }

    fieldset{
        border: 2px solid #4a90e2;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 20px;
    }

    legend{
        font-size: 20px;
        font-weight: bold;
        color: #4a90e2;
    }

    input, select, textarea{
        padding: 8px;
        border-radius: 5px;
        border: 1px solid #ccc;
    }

    button{
        background-color: #4a90e2;
        color: white;
        padding: 10px 15px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    button:hover{
        background-color: #357abd;
    }
</style>

<form action="#" method="post">
 <fieldset>
 <legend>Datos personales</legend>

 <label for="nombre">Nombres y apellidos:</label>
 <input type="text" id="nombre" name="nombre" required minlength="3" maxlength="80">

 <br><br>

 <label for="correo">Correo electrónico:</label>
 <input type="email" id="correo" name="correo" required placeholder="ejemplo@correo.com">

 <br><br>

 <label for="telefono">Teléfono:</label>
 <input type="tel" id="telefono" name="telefono" placeholder="0999999999" pattern="[0-9]{10}">

 <br><br>

 <label for="edad">Edad:</label>
 <input type="number" id="edad" name="edad" min="15" max="80" required>

 <br><br>

 <label for="fecha">Fecha de nacimiento:</label>
 <input type="date" id="fecha" name="fecha">
 </fieldset>

 <br>

 <fieldset>
 <legend>Datos académicos</legend>

 <label for="carrera">Carrera o curso:</label>
 <input type="text" id="carrera" name="carrera" required>

 <br><br>

 <label for="nivel">Nivel académico:</label>
 <select id="nivel" name="nivel" required>
 <option value="">Seleccione una opción</option>
 <option value="bachillerato">Bachillerato</option>
 <option value="tecnologico">Tecnológico</option>
 <option value="universitario">Universitario</option>
 </select>

 <br><br>

 <label for="institucion">Institución educativa:</label>
 <input type="text" id="institucion" name="institucion">
 </fieldset>

 <br>

 <button type="submit">Enviar inscripción</button>
 <button type="reset">Limpiar formulario</button>
</form>
